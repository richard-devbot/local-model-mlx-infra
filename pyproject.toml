[project]
name = "local-model-infra"
version = "0.1.0"
description = "Production-grade local model infrastructure for Apple Silicon (M-series) with on-demand VRAM arbitration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "mlx>=0.22.0",
    "mlx-lm>=0.20.0",
    "huggingface-hub>=0.25.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
